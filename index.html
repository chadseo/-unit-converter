<style>
  :root{
    --bg:#15171c;
    --panel:#1c1f26;
    --panel-2:#23272f;
    --line:#2e333d;
    --txt:#e7eaf0;
    --txt-dim:#8b93a3;
    --accent:#f0a437;
    --accent-dim:#7a5a22;
    --good:#5fd0a0;
    --mono:"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, #20242d 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:28px 16px 48px;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:760px}

  header{display:flex;align-items:center;gap:13px;margin-bottom:22px}
  .applogo{
    width:46px;height:46px;border-radius:11px;flex-shrink:0;
    box-shadow:0 2px 10px rgba(0,0,0,.5), 0 0 0 1px var(--line);
  }
  header h1{
    font-size:19px;font-weight:600;letter-spacing:.5px;
  }
  header h1 .mk{color:var(--accent)}
  header .sub{
    font-family:var(--mono);font-size:11px;color:var(--txt-dim);
    letter-spacing:1px;text-transform:uppercase;margin-left:auto;
  }

  /* category tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .tab{
    background:var(--panel);border:1px solid var(--line);
    color:var(--txt-dim);
    padding:7px 14px;border-radius:7px;cursor:pointer;
    font-size:13px;letter-spacing:.3px;
    transition:all .14s ease;user-select:none;
  }
  .tab:hover{color:var(--txt);border-color:#3a4150}
  .tab.active{
    background:var(--accent);border-color:var(--accent);
    color:#1a1206;font-weight:600;
  }

  /* input row */
  .inputbar{
    display:flex;gap:10px;margin-bottom:14px;
  }
  .infield{
    flex:1;position:relative;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:12px 14px;
    transition:border-color .14s;
  }
  .infield:focus-within{border-color:var(--accent)}
  .infield label{
    display:block;font-size:10px;color:var(--txt-dim);
    letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;
  }
  .infield input{
    width:100%;background:transparent;border:0;outline:0;
    color:var(--txt);font-family:var(--mono);font-size:22px;font-weight:500;
  }
  .infield input::placeholder{color:#454c59}
  .unitsel{
    width:170px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:12px 14px;
  }
  .unitsel label{
    display:block;font-size:10px;color:var(--txt-dim);
    letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;
  }
  .unitsel select{
    width:100%;background:transparent;border:0;outline:0;
    color:var(--accent);font-family:var(--mono);font-size:18px;font-weight:600;
    cursor:pointer;appearance:none;
  }
  .unitsel select option{background:var(--panel-2);color:var(--txt)}

  /* results */
  .results{
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;
  }
  .row{
    display:flex;align-items:center;gap:12px;
    padding:11px 16px;border-top:1px solid var(--line);
    cursor:pointer;transition:background .1s;
  }
  .row:first-child{border-top:0}
  .row:hover{background:var(--panel-2)}
  .row.src{background:rgba(240,164,55,.07)}
  .row.src .rname{color:var(--accent)}
  .rname{
    width:150px;flex-shrink:0;
    font-size:13px;color:var(--txt-dim);letter-spacing:.2px;
  }
  .rname b{color:var(--txt);font-weight:600;font-family:var(--mono);font-size:14px;margin-right:7px}
  .rval{
    flex:1;text-align:right;font-family:var(--mono);
    font-size:16px;color:var(--txt);
    overflow-wrap:anywhere;
  }
  .row.src .rval{color:var(--accent);font-weight:600}
  .copyhint{
    font-family:var(--mono);font-size:10px;color:transparent;
    flex-shrink:0;width:34px;text-align:right;letter-spacing:.5px;
  }
  .row:hover .copyhint{color:var(--txt-dim)}
  .row.copied .copyhint{color:var(--good)}

  footer{
    margin-top:18px;font-family:var(--mono);font-size:11px;
    color:var(--txt-dim);line-height:1.6;
  }
  footer .ref{color:#5c6573}

  /* ---- mobile ---- */
  body{
    padding-top:max(28px, env(safe-area-inset-top));
    padding-bottom:max(48px, env(safe-area-inset-bottom));
  }
  .tab,.row{-webkit-tap-highlight-color:transparent}
  .wrap,.infield,.infield input{min-width:0}
  @media (hover:none){
    .row:hover{background:transparent}
    .row.src:hover{background:rgba(240,164,55,.07)}
    .row:hover .copyhint{color:transparent}
    .row.copied .copyhint{color:var(--good)}
    .row:active{background:var(--panel-2)}
  }
  @media (max-width:560px){
    body{padding-left:12px;padding-right:12px}
    header{margin-bottom:16px;gap:11px}
    .applogo{width:40px;height:40px;border-radius:9px}
    header h1{font-size:17px}
    header .sub{display:none}
    .tabs{
      flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
      margin:0 -12px 14px;padding:0 12px;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex-shrink:0;padding:9px 15px;font-size:14px}
    .inputbar{gap:8px}
    .unitsel{width:112px}
    .row{padding:13px 12px;gap:8px}
    .rname{width:auto;flex:0 1 auto;min-width:0;font-size:12px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rname b{display:block;margin:0 0 2px;font-size:15px}
    .rval{font-size:16px}
    .copyhint{width:30px}
  }
</style>
</head>

      ["in\u00b3","Cubic inch", lin(0.016387064)],
    ]
  },
  Flow:{
    ref:"Base: sccm (volumetric).  1 slm = 1000 sccm,  1 cfm = 28316.85 sccm.",
    fmtDigits:5,
    units:[
      ["sccm","sccm", lin(1)],
      ["slm","slm", lin(1000)],
      ["L/min","Liter/min", lin(1000)],
      ["L/s","Liter/sec", lin(60000)],
      ["m\u00b3/h","Cubic m/hour", lin(16666.6667)],
      ["m\u00b3/s","Cubic m/sec", lin(6e7)],
      ["cfm","Cubic ft/min", lin(28316.846592)],
    ]
  },
};

const tabsEl = document.getElementById("tabs");
const unitInEl = document.getElementById("unitIn");
const valInEl = document.getElementById("valIn");
const resultsEl = document.getElementById("results");
const catLabelEl = document.getElementById("catLabel");
const refNoteEl = document.getElementById("refNote");

let curCat = "Pressure";

/* number formatting: significant digits, trims trailing zeros, uses
   exponential for very large / very small magnitudes */
function fmt(x, digits){
  if(x===0) return "0";
  if(!isFinite(x)) return "\u2014";
  const a = Math.abs(x);
  let s;
  if(a !== 0 && (a < 1e-4 || a >= 1e7)){
    s = x.toExponential(Math.max(2, digits-2));
  }else{
    s = x.toPrecision(digits);
    if(s.indexOf(".") >= 0 && s.indexOf("e") < 0){
      s = s.replace(/\.?0+$/,"");
    }
  }
  return s;
}

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(CATEGORIES).forEach(cat=>{
    const b = document.createElement("div");
    b.className = "tab" + (cat===curCat?" active":"");
    b.textContent = cat;
    b.onclick = ()=>selectCat(cat);
    tabsEl.appendChild(b);
  });
}

function buildUnitSelect(){
  unitInEl.innerHTML = "";
  CATEGORIES[curCat].units.forEach(([sym,name],i)=>{
    const o = document.createElement("option");
    o.value = i;
    o.textContent = sym;
    unitInEl.appendChild(o);
  });
}

function selectCat(cat){
  curCat = cat;
  catLabelEl.textContent = cat;
  refNoteEl.textContent = CATEGORIES[cat].ref;
  buildTabs();
  buildUnitSelect();
  unitInEl.value = 0;
  render();
}

function render(){
  const cfg = CATEGORIES[curCat];
  const raw = valInEl.value.trim().replace(/,/g,"");
  const srcIdx = parseInt(unitInEl.value,10) || 0;
  const v = (raw==="" ? NaN : parseFloat(raw));
  const hasVal = !isNaN(v);
  const base = hasVal ? cfg.units[srcIdx][2].to(v) : NaN;

  resultsEl.innerHTML = "";
  cfg.units.forEach(([sym,name,conv],i)=>{
    const out = hasVal ? fmt(conv.from(base), cfg.fmtDigits) : "\u2014";
    const row = document.createElement("div");
    row.className = "row" + (i===srcIdx?" src":"");
    row.innerHTML =
      `<div class="rname"><b>${sym}</b>${name}</div>`+
      `<div class="rval">${out}</div>`+
      `<div class="copyhint">COPY</div>`;
    row.onclick = ()=>{
      if(!hasVal) return;
      const txt = conv.from(base).toString();
      navigator.clipboard && navigator.clipboard.writeText(txt);
      document.querySelectorAll(".row.copied").forEach(r=>r.classList.remove("copied"));
      row.classList.add("copied");
      row.querySelector(".copyhint").textContent = "DONE";
      setTimeout(()=>{
        row.classList.remove("copied");
        row.querySelector(".copyhint").textContent = "COPY";
      },1100);
    };
    resultsEl.appendChild(row);
  });
}

valInEl.addEventListener("input", render);
unitInEl.addEventListener("change", render);

const isTouch = matchMedia("(hover:none)").matches;
if(isTouch) document.getElementById("copyTip").textContent = "Tap any row to copy the value.";

selectCat("Pressure");
if(!isTouch) valInEl.focus();

/* offline support when served over http(s); skipped for file:// */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
